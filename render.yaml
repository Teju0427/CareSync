# Render Blueprint — deploys CareSync as: Postgres DB + backend (Docker) + frontend (static site)
# Push this repo to GitHub, then in Render: New > Blueprint > point at the repo.
databases:
  - name: caresync-db
    plan: free
    databaseName: caresync
    user: caresync

services:
  - type: web
    runtime: docker
    name: caresync-backend
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: caresync-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      # Set this after the frontend is deployed, to its Render URL
      # (comma-separated if you have more than one origin).
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    runtime: static
    name: caresync-frontend
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set this to the backend service's Render URL (see steps below),
      # then trigger a redeploy so Vite bakes it into the build.
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
