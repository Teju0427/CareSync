server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Hashed build assets can be cached forever
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  # Runtime config and the HTML shell must always be fresh
  location = /config.js { add_header Cache-Control "no-store"; }
  location = /index.html { add_header Cache-Control "no-cache"; }

  location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok"; }

  # Single-page app: unknown paths fall back to the shell
  location / { try_files $uri $uri/ /index.html; }
}
