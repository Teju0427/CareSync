# Local development stack: PostgreSQL + API + web.  Start with:  docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caresync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-caresync}
      POSTGRES_DB: ${POSTGRES_DB:-caresync}
    ports: ["5432:5432"]
    volumes: [caresync_pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-caresync} -d ${POSTGRES_DB:-caresync}"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-caresync}:${POSTGRES_PASSWORD:-caresync}@db:5432/${POSTGRES_DB:-caresync}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-only-change-me}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@caresync.app}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-AdminPass123!}
      SEED_DOCTOR_PASSWORD: ${SEED_DOCTOR_PASSWORD:-DoctorPass123!}
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on: [backend]
    environment:
      # Read at container start (not build time) — change it and just restart.
      API_URL: ${API_URL:-http://localhost:8000}
    ports: ["3000:80"]

volumes:
  caresync_pgdata:
